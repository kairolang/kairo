[L002]
brief = "message from the linker"
group = "linker"

    [L002.E]
    explain = """
    # message from the linker

    the linker reported this text; the compiler passes it on at the severity the linker gave it. Verbose and debug messages show only with --verbose.

    ## how to fix

    see the linker's text; undefined symbols are fixed by adding the object or library that defines them.
    """

    [L002.F]
