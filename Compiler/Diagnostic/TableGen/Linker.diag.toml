[L003]
brief = "object file was never written"
group = "linker"

    [L003.E]
    explain = """
    # object file was never written

    a compile job ended without producing the object file, so there is nothing to link.

    ## how to fix

    fix the earlier error that stopped the job.
    """

[L004]
brief = "cannot create a temporary directory"
group = "linker"

    [L004.F]
    explain = """
    # cannot create a temporary directory

    the object files of the run are staged in a temporary directory, and it could not be created.

    ## how to fix

    check TMPDIR and the free space there.
    """

[L005]
brief = "link command line"
group = "linker"

    [L005.V]
    explain = """
    # link command line

    the exact command the compiler runs to link, shown with --verbose.

    ## how to fix

    nothing to fix.
    """

[L006]
brief = "linker input is unused"
group = "linker"

    [L006.W]
    explain = """
    # linker input is unused

    an object or library was given on the command line, but the run does not link.

    ## how to fix

    drop the input, or ask for a link.
    """

[L007]
brief = "the Kairo library cannot be used"
group = "linker"

    [L007.E]
    explain = """
    # the Kairo library cannot be used

    the Kairo runtime library in the directory could not be built, or the build left it incomplete.

    ## how to fix

    rebuild the library, or check that the directory is writable.
    """
