    the arguments written on the attribute do not match what it takes; the message says which one is wrong.

    ## how to fix

    correct the argument.
    """

[SC145]
brief = "unknown attribute"
group = "attributes"

    [SC145.E]
    explain = """
    # unknown attribute

    no attribute of this name exists.

    ## how to fix

    check the spelling of the attribute.
    """

[SC146]
brief = "use of a deprecated declaration"
group = "attributes"

    [SC146.W]
    explain = """
    # use of a deprecated declaration

    the declaration is marked '@deprecated'; the message carries the reason the author gave.

    ## how to fix

    move to the replacement the message names.
    """

[SC147]
brief = "'@hot_path' and '@cold_path' on one declaration"
group = "attributes"

    [SC147.E]
    explain = """
    # '@hot_path' and '@cold_path' on one declaration

    a path cannot be both hot and cold.

    ## how to fix

    keep one.
    """

[SC148]
brief = "'@assume' attached to a following statement"
group = "attributes"

    [SC148.E]
    explain = """
    # '@assume' attached to a following statement

    '@assume' is a statement of its own and does not attach to what follows on the same line.

    ## how to fix

    put the statement on the next line.
    """

[SC149]
brief = "a class cannot declare its own allocator"
group = "memory"

    [SC149.E]
    explain = """
    # a class cannot declare its own allocator

    `static fn op new` / `static fn op delete` (any `op new`, and a static `op
    delete`) would give a class its own allocator. Kairo does not allow it: every
    block `@create` hands out goes back to the allocator in effect at `@destroy`, and
    every Kairo object a C++ `delete` frees goes back to the program's global
    allocator. A per-class allocator breaks both pairings.

    ```kairo
    class Node {
        static fn op new(size: usize, align: usize) -> unsafe *u8 { ... }   // error
    }
    ```

    The destructor is `fn op finally(self)`, which is not an allocator.

    ## how to fix

    remove the operator. To allocate from a pool or arena, use the allocator
    interface: `create_in<T, A>(...)` / `destroy_in<T, A>(p)`, a scoped allocator, or
    `@set_global_allocator`.
    """

[SC150]
brief = "'override' overrides nothing: C++ parameter types differ"
group = "calling-convention"

    [SC150.E]
    explain = """
    # 'override' overrides nothing: C++ parameter types differ

    the method is marked 'override', but as C++ declares it the parameter types differ from the base method's, so it overrides nothing.

    ## how to fix

    match the base method's parameter types.
    """

[SC151]
brief = "named function in a body uses a local of the enclosing function"
group = "closures"

