[SC002]
brief = "type contains itself by value"
group = "layout"

    [SC002.E]
    explain = """
    # recursive type layout

    a type's definition requires its own size. the by-value edges of a type - value fields, base
    classes, fixed-array elements, tuple elements, and generic arguments that land by value - form a
    cycle, so no layout assignment exists. only these edges are considered: a pointer, a nullable, a
    vector, a map or a set is satisfied by a forward declaration and never closes a cycle.

    ```kairo
    class Node {
        var next: Node;    // Node's size includes Node's size
    }
    ```

    ## how to fix

    break the cycle with an indirection: hold the recursive member behind a pointer (`*Node`), a
    nullable (`Node?`), or a vector (`[Node]`). one indirection anywhere on the cycle is enough.
    """

    [SC002.N]
    explain = """
    # note: a step on the layout cycle

    attached to a recursive-layout error. each note names one by-value edge on the cycle, in the
    order the layout walk took them, so the whole path from the reported type back to itself is
    visible.
    """
[SC003]
brief = "unreachable code after a control transfer"
group = "unreachable-code"

    [SC003.W]
    explain = """
    # unreachable code

    the statement before this one always transfers control out of the block - a `return`, `break`,
    `continue`, `jump!`, or a call that never returns - so nothing after it in the same block can
    ever run. the statements are still checked, but they are dropped during lowering.

    ## example

    ```kairo
    fn f() -> i32 {
        return 1;
        var x = 2;    // never runs
    }
    ```

    ## how to fix

    delete the dead statements, or move them before the control transfer. a `label!` immediately
    after the transfer makes the following code reachable again and silences this warning.
    """

[SC004]
brief = "name is a C++ keyword"
group = "cxx-interop"

    [SC004.E]
    explain = """
    # name collides with a C++ keyword

    kairo declarations are emitted as C++ and keep their spelling, so a name that is a keyword in
    C++ cannot be written out. the generated translation unit would not parse, so this is rejected
    at the declaration rather than at codegen.

    ## example

    ```kairo
    class template { }    // `template` is a C++ keyword
    ```

    ## how to fix

    rename the declaration. if the name must survive into the generated C++ for an external ABI,
    give it an explicit external name instead of spelling it as the identifier.
    """

[SC005]
brief = "name is reserved to the C++ implementation"
group = "cxx-interop"

    [SC005.W]
    explain = """
    # reserved name

    C++ reserves whole classes of identifiers to the implementation: names containing a double
    underscore, names beginning with an underscore followed by a capital letter, and names beginning
    with an underscore at global scope. using one is undefined behavior, and it may silently collide
    with a standard-library or compiler-internal name in the emitted C++.

    ## how to fix

    rename the declaration so it does not start with an underscore and contains no `__`.
    """

[SC006]
brief = "`jump!` target has no matching `label!`"
group = "control-flow"

    [SC006.E]
    explain = """
    # unknown jump target

    `jump!` names a `label!` declared in the same function. no `label!` with this name is visible
    from the jump, so there is nowhere to transfer control to. labels do not cross function
    boundaries, and a label inside a nested lambda is not visible to the enclosing function.

    ## example

    ```kairo
    fn f() {
        jump!(done);    // no `label!(done)` in this function
    }
    ```

    ## how to fix

    declare `label!(done)` in the same function, or correct the spelling of the target.
    """

[SC007]
brief = "duplicate `label!` name"
group = "control-flow"

    [SC007.E]
    explain = """
    # duplicate label

    two `label!` declarations in one function share a name, so a `jump!` to it has two possible
    destinations. label names are unique per function.

    ## how to fix

    rename one of the labels.
    """

[SC008]
brief = "duplicate catch-all arm"
group = "unreachable-code"

    [SC008.E]
    explain = """
    # duplicate catch-all

    an earlier arm in this construct already matches everything - a `default` or `_` arm in a
    `match`, or a bare `catch` in a `try` - and this arm is another one. two catch-alls in one
    construct is a mistake rather than dead code, because the second can never be intended.

    ## example

    ```kairo
    match x {
        case _ { f(); }
        case _ { g(); }    // a catch-all already matches everything
    }
    ```

    ## how to fix

    delete the duplicate, or give one of the two arms a real pattern or filter.
    """

[SC009]
brief = "unreachable arm after a catch-all"
group = "unreachable-code"

    [SC009.W]
    explain = """
    # unreachable arm

    arms are tried in source order, and an earlier one matches everything: a `default`/`_` arm, a
    bare `catch`, or an irrefutable pattern alternative. this arm is never selected.

    ## example

    ```kairo
    match x {
        case _ { f(); }
        case 1 { g(); }    // never selected
    }
    ```

    ## how to fix

    move the catch-all to the end, where it belongs, or delete this arm.
    """

[SC010]
brief = "duplicate binding name in a pattern"
group = "pattern-matching"

    [SC010.E]
    explain = """
    # duplicate binding

    a name may bind at most once per pattern alternative. binding it twice would leave the arm body
    with two distinct values under one name and no rule for which one wins.

    ## example

    ```kairo
    case Point{ x: a, y: a } { }    // `a` binds twice
    ```

    ## how to fix

    give the second binding a different name. to require the two positions to be equal, bind them
    separately and test with a guard.
    """

[SC011]
brief = "pattern alternatives bind different names"
group = "pattern-matching"

    [SC011.E]
    explain = """
    # inconsistent alternative bindings

    the alternatives of one pattern share a single arm body, so every alternative must make exactly
    the same names available to it. this alternative's bindings differ from the first one's, which
    would leave a name unbound on some paths into the body.

    ## example

    ```kairo
    case A{ v: n } | B{ } { use(n); }    // `n` is unbound on the `B` path
    ```

    ## how to fix

    bind the same set of names in every alternative, or split the alternatives into separate arms.
    """

[SC012]
brief = "loop label does not name an enclosing loop"
group = "control-flow"

    [SC012.E]
    explain = """
    # unknown loop label

    a labelled `break` or `continue` names the loop it acts on, and that loop must enclose the
    statement. no enclosing loop carries this label.

    ## example

    ```kairo
    outer: for var i = 0; i < n; i++ {
        break inner;    // no enclosing loop is labelled `inner`
    }
    ```

    ## how to fix

    correct the label, or add it to the loop you meant to target.
    """

[SC013]
brief = "`break` or `continue` outside of a loop"
group = "control-flow"

    [SC013.E]
    explain = """
    # loop control outside a loop

    `break` and `continue` act on an enclosing loop, and there is none here. a lambda body is a new
    function: a loop outside the lambda does not enclose statements inside it.

    ## how to fix

    move the statement into the loop, or use `return` if you meant to leave the function.
    """

[SC014]
brief = "control transfer out of a `finally` block"
group = "control-flow"

    [SC014.E]
    explain = """
    # control cannot leave a `finally` block

    a `finally` body is cleanup code. it is lowered to a deferred lambda that runs at scope exit,
    after the enclosing control flow has already been decided, so it cannot alter it: no loop is
    live to `break` or `continue`, and a `return` has no function frame left to return from.

    ## example

    ```kairo
    for var i = 0; i < n; i++ {
        try { f(); }
        finally { break; }    // no loop is live when this runs
    }
    ```

    ## how to fix

    record what happened in a variable inside the `finally` body and act on it after the `try`
    statement, where the enclosing control flow is still live.
    """

[SC015]
brief = "loop label shadows an enclosing label"
group = "shadowing"

    [SC015.W]
    explain = """
    # shadowed loop label

    an enclosing loop already carries this label. inside this loop a labelled `break` or `continue`
    binds to the innermost match, so the outer loop can no longer be targeted from here.

    ## how to fix

    rename one of the two labels.
    """

[SC016]
brief = "conformance constraint on a type alias"
group = "constraints"

    [SC016.W]
    explain = """
    # constraint on an alias has no effect

    a conformance constraint is checked by resolving members against a type's body. an alias has no
    body of its own - it is a name for another type - so there is nothing to check the constraint
    against and it is dropped.

    ## how to fix

    move the constraint to the aliased type itself, or to the function that uses the alias.
    """

[SC017]
brief = "identifier uses the reserved compiler prefix"
group = "names"

    [SC017.E]
    explain = """
    # reserved prefix

    kairo emits your names into c++ unmangled, and it also invents a few names of its own for
    constructs c++ cannot spell - `op in` becomes `__kairo_contains`, `op ^^` becomes
    `__kairo_pow`, and so on. every invented name starts with the same reserved prefix.

    a declaration that starts with that prefix can therefore collide with a name the compiler
    minted, in a translation unit you never wrote. the collision surfaces as a c++ redefinition
    of a symbol with no kairo declaration behind it, which is why this is an error at the
    declaration rather than a warning.

    the prefix is also reserved to the implementation by c++ itself ([lex.name]/3), so defining
    one is undefined behaviour independently of kairo.

    ## how to fix

    rename the declaration. nothing in user code needs this prefix.
    """

[SC018]
brief = "keyword-only parameter given positionally"
group = "calls"

    [SC018.E]
    explain = """
    # this parameter can only be given by name

    the parameter follows a pack. every positional argument after the ones that fill the parameters
    before the pack belongs to the PACK, so a positional argument can never reach this parameter -
    there is no count at which it would stop being part of the pack.

    ## how to fix

    pass it by name: `f(a, b, end: x)`.
    """

[SC019]
brief = "no parameter with this name"
group = "calls"

    [SC019.E]
    explain = """
    # no parameter by that name

    the callee has no parameter with the name used at the call site. names are matched against the
    SELECTED declaration's parameters, so a typo here is not a silent positional argument.

    ## how to fix

    check the spelling against the declaration, or drop the label to pass it positionally.
    """

[SC020]
brief = "parameter given both positionally and by name"
group = "calls"

    [SC020.E]
    explain = """
    # this parameter was already given

    the parameter is filled twice: once by position and once by name, or twice by name. which
    argument wins would be arbitrary, so neither does.

    ## how to fix

    remove one of the two arguments.
    """

[SC021]
brief = "required parameter not given"
group = "calls"

    [SC021.E]
    explain = """
    # missing argument

    the parameter has no default, and no argument reached it - positionally or by name. a parameter
    without a default may follow one WITH a default, so the parameters before it being satisfied
    says nothing about this one.

    ## how to fix

    pass the parameter, or give it a default in the declaration.
    """

[SC022]
brief = "named argument between two pack arguments"
group = "calls"

    [SC022.E]
    explain = """
    # the pack must be contiguous

    a named argument appears between two arguments that belong to the pack. the pack is recorded as
    a first argument plus a length, because that is what lets a call be reordered into the order c++
    needs without re-deriving which arguments were pack members. an argument spliced into the middle
    of the pack has no place in that description: the run from the first pack argument to the last
    would include one that is not a pack member at all.

    ## how to fix

    move the named argument after the pack arguments. `f(a, b, k: x)` rather than `f(a, k: x, b)` -
    named arguments are matched by name, so their position among themselves never mattered.
    """
