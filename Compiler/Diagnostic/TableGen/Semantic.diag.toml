    the attribute only applies to certain declarations or statements, such as a function, and was written on another kind.

    ## how to fix

    remove the attribute, or move it to a declaration it applies to.
    """

[SC144]
brief = "attribute argument is invalid"
group = "attributes"

    [SC144.E]
