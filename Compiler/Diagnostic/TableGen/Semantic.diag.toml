[SC200]
brief = "operation not allowed in a promising function"
group = "purity"

    [SC200.E]
    explain = """
    # operation not allowed in a promising function

    a const or pure function promised not to do this.

    `fn f(...) const` becomes `[[gnu::const]]` and `@pure` becomes
    `[[gnu::pure]]`. clang optimizes on both without reading the body: it
    deletes a call whose result is unused, merges repeated calls (a const
    one even across a store), and assumes the call returns, never unwinds
    and frees nothing. So:

    - the function returns a value, returns at all (not `-> !`), is not
      `@unwind`, virtual, an interface requirement, a generator or `async`,
      and its result type owns no memory;
    - a const function reads only its inputs: no global or static, no
      dereference, no field read through a pointer, no read of a parameter
      passed by reference (`@inout`, `@move`, `const p: Record`, `self`);
    - a pure function writes no memory outside its own locals;
    - both call only const fns, @pure fns, eval fns and the side-effect-free
      intrinsics, never a function value or an interface requirement; make
      no value that owns memory (a string, a vector, an f-string, a by-value
      copy of one); and have no `assert`, `unwrap!`, asserting downcast,
      `delete`, inline C++, `spawn`, `thread` or `await`.

    `panic` is a return, and is allowed.

    ## how to fix

    remove the operation or the promise.
    """

