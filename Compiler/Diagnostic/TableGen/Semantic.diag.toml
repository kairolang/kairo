[SC272]
brief = "'prot' declaration in a file with no module"
group = "access"

    [SC272.W]
    explain = """
    # 'prot' declaration in a file with no module

    `prot` makes a declaration visible to every file of its module: the
    files under the nearest directory, at or above the declaring file, that
    holds a `module.k`. The declaring file has no `module.k` above it, so it
    belongs to no module and its `prot` reaches only what `priv` reaches:
    the file itself (and, for a member, the classes deriving from its class).
    The use this warning rides on is in another file, so it was refused.

    ```kairo
    // shapes/area.k, with no shapes/module.k
    prot fn scale() -> i32 { return 2; }

    // shapes/main.k
    import self::area;
    fn main() -> i32 { return area::scale(); }   // refused
    ```

    ## how to fix

    put a `module.k` in the directory that should share the declaration
    (an empty file is enough), or make the declaration `pub`.
    """

    [SC272.N]
    explain = "Points at the declaration."

[SC273]
brief = "method never mutates 'self'"
group = "const-self"

    [SC273.W]
    explain = """
    # method never mutates 'self'

    Opt-in (`-Wconst-self`). The method takes `self` but nothing in its body
    changes the object: every use of `self` reads a field, calls a
    `const self` method (or one this lint finds the same about, decided over
    the whole file at once), or passes it where it is only read. Declaring
    it `const self` says so, and lets the method be called on a `const`
    object or through a `const` reference.

    ```kairo
    class Counter {
        var n: i32 = 0
        fn get(self) -> i32 { return self.n }   // warned
        fn bump(self) { self.n += 1 }           // writes self.n: not warned
    }
    ```

    Not warned: a constructor, `op delete`, an assignment operator, a
    `virtual` / `override` method or one in a class with a polymorphic base,
    a method of a record or extension that implements an interface (the
    requirement fixes the signature), a generic method or one in a generic
    record, an out-of-line definition, and library code. A use of `self`
    the analysis does not recognise as a read keeps the method quiet: the
    lint never claims a method is const-able when it might not be.

    ## how to fix

    write `const self`; the fix-it inserts `const`.
    """

[SC274]
brief = "'@inout' parameter is never mutated"
group = "const-self"

    [SC274.W]
    explain = """
    # '@inout' parameter is never mutated

    Opt-in (`-Wconst-self`). An `@inout` parameter promises the caller that
    the function may change the argument, and makes every caller pass a
    mutable place. This body only reads it, so `const` says what it does:
    the argument is still passed without a copy, and a caller may pass a
    `const` value or a temporary.

    ```kairo
    fn total(@inout xs: [i32]) -> i32 { ... }   // only reads xs: warned
    ```

    The same functions are skipped as for a method's `self` (SC273W). A
    by-value record parameter that is never mutated is SC224W, which is on
    by default.

    ## how to fix

    replace `@inout` with `const` (the fix-it does), then drop the `&`
    at each call: `total(&v)` becomes `total(v)`.
    """

[SC275]
brief = "write to a by-value 'for' loop variable is lost"
group = "lint"

    [SC275.W]
    explain = """
    # write to a by-value 'for' loop variable is lost

    `for x in v` binds each element as a VALUE: `x` is a copy, made fresh
    for every iteration. Writing it (`x = ...`, `x.f = ...`, `x += ...`,
    passing `&x` to an `@inout` parameter) changes the copy only, and
    when nothing in the loop body reads `x` after the write, the write
    has no effect at all: it can only have been meant for the element.

    ```kairo
    for p in points {
        p.x = 0              // warned: points is not changed
    }
    ```

    Not warned: a body that reads the variable after writing it (the copy
    is being used as a scratch value), a `for *x` loop, an element that is
    itself a pointer, and a range over integers.

    ## how to fix

    bind a pointer to the element: `for *p in points` (the fix-it inserts
    the `*`). Uses of `p` then go through the pointer, and the write
    reaches the collection. If the copy is what you meant, read it or
    drop the write.
    """

    [SC275.N]
    explain = "Points at the loop variable that holds the copy."

[SC276]
brief = "a literal suffix on a joined string applies to the whole string"
group = "literals"

    [SC276.W]
    explain = """
    # a literal suffix on a joined string applies to the whole string

    String literals written side by side are one string (`"12" "3"` is
    `"123"`). A literal suffix on any of the segments belongs to that one
    string, as in C++: `"12" "3"_km` is `"123"_km`, so `operator""_km`
    receives all three bytes, not only the `"3"` it is written after. A
    suffix on the first segment reads the same way the other way round: it
    is not only `"12"`'s.

    ```kairo
    var d = "12" "3"_km      // warned: the whole "123" is passed to _km
    ```

    Two segments with different suffixes are an error (SC277E), and a
    joined string with an f segment takes no suffix at all (SC074E).

    ## how to fix

    write the string as one literal with the suffix after its closing
    quote. The fix-it does this when the segments can be joined by text:
    every segment has the head's prefix (plain or raw), none is an f
    segment or triple-quoted, and none was made by a macro (`stringify!`,
    `file!`). Otherwise the warning names the edit and makes none. To keep
    the segments, silence it with `@no_warn(SC276W)` on the declaration.
    """

[SC277]
brief = "segments of a joined string have different literal suffixes"
group = "literals"

    [SC277.E]
    explain = """
    # segments of a joined string have different literal suffixes

    Adjacent string literals are one string, and a literal suffix applies
    to the whole of it (SC276W). Two segments that spell different
    suffixes ask for two literal operators on one string, so neither can
    be chosen; C++ rejects the same concatenation.

    ```kairo
    var d = "12"_km "3"_mi   // error: '_km' and '_mi'
    ```

    ## how to fix

    keep one suffix (on any segment; after the last one reads best), or
    split the string into two literals, one per operator.
    """

    [SC277.N]
    explain = "Points at the first segment's suffix."

[SC278]
brief = "a derived method does not replace the CRTP hook its base calls through dyn()"
group = "lint"

    [SC278.W]
    explain = """
    # a derived method does not replace the CRTP hook its base calls

    A generic base calls the class that derives it through a method like
    `fn dyn(self) -> unsafe *D { return &self as *D }` (generics.mdx,
    "Mixins"): `self.dyn()->hook(x)` is meant to run the derived class's
    `hook`. A derived method with the hook's name and number of parameters
    but other parameter types does not replace it: methods with different
    parameters merge into one overload set (classes-inheritance.mdx), and
    the base's call keeps choosing the base's own `hook`. Nothing fails;
    the derived method just never runs from there.

    ```kairo
    class <D: type> Visitor {
        fn dyn(self) -> unsafe *D { return unsafe ((&self) as *D) }
        fn walk(self, n: unsafe *Node) { self.dyn()->hook(n) }
        fn hook(self, n: unsafe *Node) { }
    }
    class Mine derives Visitor<Mine> {
        fn hook(self, n: *Node?) { }   // warned: walk() still runs Visitor::hook
    }
    ```

    The warning needs all of: a base method with no parameter but `self`
    that returns a pointer to one of its class's type parameters (the dyn
    method); a call through it of the hook's name with the same number of
    arguments, in the class or any base; and a base method of that name and
    arity, none of which takes this method's parameter types (as C++ sees
    them: `*T` and `unsafe *T` are both `T*`, and do replace the hook;
    `*T?` is not), modes and `self` constness. A base parameter that
    depends on a type parameter is not compared.

    ## how to fix

    take exactly the base hook's parameter types. When they differ only in
    pointer safety, nullability or `const` of the same pointee, the fix-it
    rewrites them. If a second overload is what you meant, give it another
    name, or keep it with `@no_warn(SC278W)` on the method.
    """

    [SC278.N]
    explain = "Points at the base's hook, or at a call of it through the dyn method."

[SC282]
brief = "a pointer type cannot be extended"
group = "extend"

    [SC282.E]
    explain = """
    # a pointer type cannot be extended

    An `extend` block adds members to one type. A pointer has no members of
    its own: `p->m` reads the member of what `p` points to. So the target of
    an `extend` is never `*T`, `*const T` or `unsafe *T`, generic or not.
    A container OF pointers is an ordinary type and can be extended.

    ```kairo
    extend *i32 { fn f(self) -> i32 { return 1 } }       // error
    extend <T> [*T] { fn f(self) -> i32 { return 1 } }   // fine
    ```

    ## how to fix

    extend the type the pointer points to, and call its members through the
    pointer with `->`. SC283E (a function type) and SC284E (a bare type
    parameter) are the other targets an `extend` cannot have.
    """

[SC283]
brief = "a function type cannot be extended"
group = "extend"

    [SC283.E]
    explain = """
    # a function type cannot be extended

    A function type (`fn(i32) -> i32`, `unsafe fn()`, one with a calling
    convention) is the type of a function pointer or a closure value. It is
    not a type an `extend` can add members to: a call `f.m()` on a value of
    it would read like a call of the function itself, and every function
    with that signature, in every module, would gain the member.

    ```kairo
    extend fn(i32) -> i32 { fn twice(self) -> i32 { return 2 } }   // error
    ```

    ## how to fix

    write a free function that takes the function value as a parameter
    (`fn twice(f: fn(i32) -> i32, x: i32) -> i32`), or wrap the function in
    a struct or class and extend that.
    """

[SC284]
brief = "an extend of a bare type parameter would add members to every type"
group = "extend"

    [SC284.E]
    explain = """
    # an extend of a bare type parameter would add members to every type

    `extend <T> T` names no type: its target matches every type there is, so
    its members would join the member lookup of every type in every file
    that sees the block, `i32`, `string` and every class alike, bound or
    not. That makes any member call ambiguous or silently redirected by a
    block nobody at the call site wrote, which is why it is refused. A
    bound (`extend <T impl Show> T`) does not change that: the set is every
    type that has the bound, decided per type and changing as types gain
    conformances. `extend <T> T?` is the same over every nullable type.

    ```kairo
    extend <T> T { fn describe(self) -> string { return "?" } }    // error
    extend <T> [T] { fn describe(self) -> string { return "?" } }  // fine
    ```

    ## how to fix

    extend a named type (`extend i32`, `extend Point`) or a generic type
    constructor over the parameter (`extend <T> [T]`, `extend <T> Box<T>`,
    `extend <T> [T]?`), or write a free generic function
    (`fn <T impl Show> describe(x: T) -> string`).
    """

[SC291]
brief = "constant index out of range for a fixed array"
group = "type-check"

    [SC291.E]
    explain = """
    # constant index out of range for a fixed array

    the index of `a[i]` is a constant, `a` is a fixed array `[T; N]`, and the
    index is negative or not below `N`. the access can only fail, so it is
    reported where it is written instead of at run time.

    ```kairo
    var a: [i32; 2] = [1, 2]
    a[5] = 1          // error: index 5 is out of range for '[i32; 2]', which has 2 elements
    return a[1]       // fine
    ```

    ## how to fix

    use an index from `0` to `N - 1`, or make the array longer.
    """

[SC292]
brief = "type argument does not meet a kind bound"
group = "generics"

    [SC292.E]
    explain = """
    # type argument does not meet a kind bound

    a kind bound restricts a type parameter to one category of declaration:
    `T: class`, `T: struct`, `T: enum` or `T: union`. the argument given for
    it (written or deduced) is a different kind of type.

    ```kairo
    fn <T: class> f(x: T) -> i32 { return 1 }
    f(1)        // error: 'i32' is not a class, so it cannot be 'T'
    ```

    ## how to fix

    pass a type of the bounded kind, or drop or change the bound.
    """

    [SC292.N]
    explain = "Points at the kind bound the argument does not meet."

[SC290]
brief = "'eval' destructor"
group = "eval"

    [SC290.E]
    explain = """
    # 'eval' destructor

    a compile-time object is never destroyed, so a destructor declared
    'eval' would never run. C++ has no consteval destructor either.

        class S {
            pub var v: i32 = 1
            eval fn op finally(self) { }    // error
        }

    ## how to fix

    remove 'eval' from the destructor. A class with a non-trivial
    destructor cannot be an 'eval' value at all; give it a trivial one
    (no 'op finally') to use it at compile time.
    """
