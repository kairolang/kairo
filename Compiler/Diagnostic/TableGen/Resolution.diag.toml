[R001]
brief = "place holder diagnostics"
group = "Uncategorized"
    [R001.W]
    explain = "This is placeholder diagnostics. (Warning)"
    [R001.I]
    explain = "This is placeholder diagnostics. (Info)"
    [R001.R]
    explain = "This is placeholder diagnostics. (Remark)"
    [R001.V]
    explain = "This is placeholder diagnostics. (Verbose)"
    [R001.N]
    explain = "This is placeholder diagnostics. (Note)"
    [R001.D]
    explain = "This is placeholder diagnostics. (Debug)"
    [R001.E]
    explain = "This is placeholder diagnostics. (Error)"
    [R001.F]
    explain = "This is placeholder diagnostics. (Fatal)"

[R003]
brief = "undefined macro"
group = "macro"

    [R003.E]
    explain = """
    macro lookup failed because an imported scope, macro table, or resolution dependency could not be
    processed correctly. this diagnostic indicates a resolution failure rather than an absent definition.
    """

    [R003.W]
    explain = """
    The macro was invoked but could not be resolved. This may
    indicate a missing import or a typo in the macro name.
    Expansion was skipped.
    """

    [R003.N]
    explain = "Related to an undefined macro reference above."

[R002]
brief = "failed to lex imported file"
group = "import"

    [R002.E]
    explain = """
    # failed to lex imported file

    the preprocessor attempted to lex a file that is referenced by an import statement, but the lexer
    returned an error. this usually means the file does not exist, cannot be read, or contains
    unrecoverable lexical errors.

    ## how to fix
    verify that the imported file path is correct and that the file is accessible and well-formed.
    """

[R004]
brief = "no tokens available for imported file"
group = "import"

    [R004.E]
    explain = """
    # no tokens for imported file

    the preprocessor successfully located an imported file but obtained an empty or null token stream.
    this is an internal consistency error that may indicate a corrupted token cache or a double-load race.

    ## how to fix
    if this is a user-visible error, file a bug report. ensure the file is not empty and that the
    lexer processes it before the preprocessor runs.
    """

[R005]
brief = "ambiguous module path"
group = "import"

    [R005.W]
    explain = """
    # ambiguous module

    a module path resolves to both a directory (`Foo/Bar/`) and a file (`Foo/Bar.k`). the compiler
    will prefer the file, but this is likely a project layout mistake.

    ## how to fix
    rename one of the conflicting paths or use the `module` disambiguation keyword (`import module Foo::Bar`)
    to explicitly select the directory-based module.
    """

[R006]
brief = "macro invoked without required arguments"
group = "macro"

    [R006.E]
    explain = """
    # macro requires arguments

    a parameterized macro was invoked without providing any arguments. macros defined with a parameter
    list must be called with matching arguments.

    ## example

    - correct usage:
    ```kairo
    macro add!(a, b) { a + b }
    var x = add!(1, 2);
    ```

    - incorrect usage:
    ```kairo
    var x = add!;   // missing argument list
    ```

    ## how to fix
    add the argument list: `add!(1, 2)`.
    """

[R007]
brief = "macro invoked with arguments but accepts none"
group = "macro"

    [R007.E]
    explain = """
    # macro does not accept arguments

    a parameterless macro (defined without a parameter list) was invoked with arguments.

    ## example

    - correct usage:
    ```kairo
    macro greet! { "hello" }
    var s = greet!;
    ```

    - incorrect usage:
    ```kairo
    var s = greet!("world");  // unexpected args
    ```

    ## how to fix
    remove the argument list from the invocation.
    """

[R008]
brief = "macro expansion error"
group = "macro"

    [R008.E]
    explain = """
    # macro expansion error

    an error occurred while expanding a macro invocation. this covers argument count mismatches, too
    many arguments, too few arguments, or errors in nested expansion.

    ## how to fix
    check the macro definition for the expected parameter list and ensure the invocation supplies
    the correct number of arguments. see the accompanying note for the exact problem.
    """

[R009]
brief = "builtin macro misuse"
group = "macro"

    [R009.E]
    explain = """
    # builtin macro error

    a compiler-provided builtin macro (such as `error!`, `warn!`, `first!`, `last!`, `unstringify!`)
    was called with incorrect arguments or in an unsupported context.

    ## how to fix
    consult the builtin macro documentation for the expected argument types and counts.
    """

[R010]
brief = "user-emitted diagnostic via error!() macro"
group = "macro"

    [R010.E]
    explain = """
    # error!() macro diagnostic

    the source file explicitly invoked `error!(message)` to emit a compile-time error.
    this is a user-defined diagnostic, not a compiler bug.
    """

    [R010.W]
    explain = """
    # warn!() macro diagnostic

    the source file explicitly invoked `warn!(message)` to emit a compile-time warning.
    this is a user-defined diagnostic, not a compiler bug.
    """

    [R010.N]
    explain = """
    # note!() macro diagnostic

    the source file explicitly invoked `note!(message)` to emit a compile-time note.
    """

[R011]
brief = "failed to resolve import path"
group = "import"

    [R011.E]
    explain = """
    # failed to resolve import path

    the preprocessor attempted to resolve an import path but could not locate a matching file or module.
    this may indicate a missing file, a typo in the import statement, or an incorrect project layout.

    ## how to fix
    verify that the imported file or module exists and that the import statement uses the correct path.
    """

[R012]
brief = "declaration is not permitted inside a macro body"
group = "macro"

    [R012.E]
    explain = """
    # declaration not permitted inside macro body

    an import or macro declaration appeared inside the replacement body of a token macro.

    token macro expansion may produce ordinary source tokens, but it may not introduce new imports
    or macro definitions. allowing these declarations would make dependency discovery and macro
    visibility depend on expansion order.

    ## example

    ```kairo
    macro invalid! {
        import Foo::*;
    }
    ```

    ## how to fix

    move the import or macro declaration outside the macro body. the macro may then reference names
    made visible by that declaration.
    """

[R013]
brief = "unknown macro invocation"
group = "macro"

    [R013.E]
    explain = """
    # unknown macro invocation

    a macro was invoked, but no visible definition with that name could be found.

    macro lookup considers definitions visible at the invocation point, including accessible imported
    macros and definitions in enclosing scopes. definitions declared later in the source are not visible
    when macro visibility is order-dependent.

    ## example

    ```kairo
    var value = missing_macro!(42);
    ```

    ## how to fix

    verify that the macro name is spelled correctly, that its defining module is imported, and that the
    definition is visible before the invocation.
    """

[R014]
brief = "redefines builtin macro"
group = "macro"
    [R014.E]
    explain = """
    # redefines a builtin macro

    a user-defined macro has the same name as a compiler-provided builtin macro. this is not allowed
    because it would shadow the builtin and change its behavior.

    ## how to fix

    rename the user-defined macro to avoid conflicting with the builtin macro name.
    """

[R015]
brief = "imported name not found in source module"
group = "import"

    [R015.E]
    explain = """
    # imported name not found

    a selective import (`import Foo::{Bar}`) named a symbol that does not exist in the resolved source
    module. import resolution verifies each selected name against the source module's frozen symbol
    table; this is the sole place that existence is checked.

    ## how to fix

    verify the name is spelled correctly and is actually declared (at any visibility) in the source
    module. if it is a submodule, use `import module Foo::Bar` instead.
    """

[R016]
brief = "ambiguous import"
group = "import"

    [R016.E]
    explain = """
    # ambiguous import

    two or more non-function symbols were folded into the current file under the same name (for
    example, two different types imported from two modules, or a type and a module handle). unlike
    function overloads, which union into one overload set, non-function targets cannot coexist under
    one name.

    ## how to fix

    alias one of the conflicting imports (`import Foo::{Bar as FooBar}`) or import them selectively so
    each visible name binds a single target.
    """

[R017]
brief = "ambiguous relative import"
group = "import"

    [R017.E]
    explain = """
    # ambiguous relative import

    an unqualified import path matched BOTH a module in the importing file's own directory and a
    module in a search root. unqualified imports resolve sibling-first, then root, so the sibling
    would win silently - and the day someone adds or removes a file, the same import would start
    naming a different module in a different directory.

    ```kairo
    // root/Foo/bar.k, with both root/Foo/baz.k and root/baz.k on disk
    import baz;   // which one?
    ```

    ## how to fix

    qualify the path so it names exactly one module (`import Foo::baz` for the sibling), or rename
    one of the two files so the name is unambiguous across the tree.
    """

[R018]
brief = "module filename collision"
group = "import"

    [R018.E]
    explain = """
    # two files claim one module name

    a module's name comes from its filename, and `-` in a filename means `_` in the module name. two
    files in one directory therefore collide when they differ only by that mapping: `foo-bar.k` and
    `foo_bar.k` both name module `foo_bar`, so an import of it cannot say which file it means.

    ## how to fix

    rename one of the files. prefer `_` in new filenames; `-` is supported only as a pragmatic
    spelling of the same module name.
    """

[R019]
brief = "import depth limit exceeded"
group = "import"

    [R019.E]
    explain = """
    # import depth limit exceeded

    the chain of `import` statements reachable from an entry file grew deeper than
    `--cmax-import-depth` allows before the dependency graph finished scanning. this is almost
    always an accidental import cycle that the cycle guard doesn't catch (each individual link is
    a distinct file, so nothing repeats), or a project layout that fans out through many
    indirection layers.

    ## how to fix

    check the reported file's own imports for an unintended long chain, or raise the limit with
    `--cmax-import-depth=N` if the project genuinely needs deeper nesting.
    """

[R020]
brief = "use of undeclared identifier"
group = "name-lookup"

    [R020.E]
    explain = """
    # undeclared identifier

    the name was looked up in every scope enclosing the use - block, function, type body, file, and
    the names brought in by `import` - and nothing declared it. the use is poisoned so later passes
    do not cascade further errors from it.

    ## example

    ```kairo
    fn f() {
        return couunt;    // no declaration named `couunt` is in scope
    }
    ```

    ## how to fix

    check the spelling, declare the name before the use, or add the `import` that brings it in. an
    out-of-line definition sees only the names visible at its own file scope, not the ones visible
    inside the type it defines a member of.
    """

[R021]
brief = "unknown type name"
group = "name-lookup"

    [R021.E]
    explain = """
    # unknown type name

    a type position named something no declaration in scope provides. type lookup searches the same
    scopes as value lookup but accepts only classes, enums, aliases, and generic parameters.

    ## example

    ```kairo
    fn f(p: Pointt) { }    // no type named `Pointt` is in scope
    ```

    ## how to fix

    check the spelling, or add the `import` that makes the type visible.
    """

[R022]
brief = "use of undeclared generic parameter"
group = "generics"

    [R022.E]
    explain = """
    # undeclared generic parameter

    the name is used as a generic parameter, but no enclosing generic declaration introduces it. a
    generic parameter is visible only inside the declaration whose parameter list declares it; it
    does not leak into sibling declarations or into an out-of-line definition that omits it.

    ## example

    ```kairo
    class Box::<T> { var v: T; }

    fn get(b: Box::<T>) -> T { }    // `T` is Box's parameter, not this function's
    ```

    ## how to fix

    add the parameter to this declaration's own generic parameter list, or name a concrete type.
    """

[R023]
brief = "name does not denote a type"
group = "name-lookup"

    [R023.E]
    explain = """
    # name is not a type

    the name resolved, but to something that cannot appear in a type position - a variable, a
    function, a module, or a const generic parameter. lookup does not fall through to a different
    entity of the same name.

    ## example

    ```kairo
    var Handle = 0;

    fn f(h: Handle) { }    // `Handle` is a value, not a type
    ```

    ## how to fix

    name the type you meant. a module is not a type: use `Mod::Type` to name a type inside it. a
    const generic parameter is a value: use it in a value position, or declare a type parameter.
    """

    [R023.N]
    explain = "Points at the declaration that was found, and says what kind of entity it declares."

[R024]
brief = "primitive type used as a scope or with generic arguments"
group = "name-lookup"

    [R024.E]
    explain = """
    # primitive types have no members

    a primitive type - `i32`, `f64`, `bool`, and the rest - is a leaf. it declares no members, so
    `::` cannot follow it, and it is not generic, so it takes no generic argument list.

    ## example

    ```kairo
    var x: i32::<8> = 0;    // `i32` is not generic
    ```

    ## how to fix

    drop the qualification or the generic argument list, and name the primitive on its own.
    """

[R025]
brief = "no member of that name in the named scope"
group = "member-lookup"

    [R025.E]
    explain = """
    # no such member

    the left side of the access resolved to a type, a module, or a value with a known type, and its
    scope was searched - including base classes and extensions in scope - without finding the name.

    ## example

    ```kairo
    class Point { pub var x: i32; }

    fn f(p: Point) -> i32 { return p.z; }    // `Point` has no member `z`
    ```

    ## how to fix

    check the spelling, or import the extension that declares the member. a private member is not
    reachable from outside its own type, and an out-of-line definition can only name members that
    the qualifying scope actually declares.
    """

[R026]
brief = "name does not denote a scope"
group = "member-lookup"

    [R026.E]
    explain = """
    # not a scope

    `::` names a member of a scope, and only a type, a module, or an enum is one. the name on the
    left of this `::` is something else, so there is no table to look the next segment up in.

    ## how to fix

    use `.` or `->` to reach a member of a value. if you meant a nested type, name the type rather
    than a value of it.
    """

[R027]
brief = "wrong member-access operator"
group = "member-lookup"

    [R027.E]
    explain = """
    # wrong access operator

    the three access operators are not interchangeable. `::` names a member of a type, a module, or
    an enum. `.` reaches a member through a value. `->` reaches a member through a pointer. the
    operator written here does not match what its left side denotes, and the compiler does not
    insert or elide an indirection to make it fit.

    ## example

    ```kairo
    class Point { pub var x: i32; }

    fn f(p: *Point) -> i32 { return p.x; }    // `p` is a pointer: use `p->x`
    ```

    ## how to fix

    use the operator that matches the left side: `::` after a type or module, `.` after a value,
    `->` after a pointer.
    """

[R028]
brief = "ambiguous member reference"
group = "member-lookup"

    [R028.E]
    explain = """
    # ambiguous member

    more than one member of this name is reachable from here, and no rule prefers one over another.
    this usually means two base classes or two extensions in scope each declare it. an ambiguous
    non-function name is an error at the use, not at the declarations.

    ## how to fix

    qualify the access with the scope you meant (`Base::name`), or remove one of the declarations
    from scope.
    """

    [R028.N]
    explain = "Points at one of the candidates that made the reference ambiguous. One note per candidate."

[R029]
brief = "redefinition"
group = "redeclaration"

    [R029.E]
    explain = """
    # redefinition

    an entity may be declared any number of times but defined once. two definitions of this name
    reached the same scope, so there is no single entity for uses to bind to. this covers ordinary
    declarations, out-of-line function definitions, and explicit specializations alike.

    ## example

    ```kairo
    fn f() -> i32 { return 1; }
    fn f() -> i32 { return 2; }    // `f` already has a definition
    ```

    ## how to fix

    delete or rename one of the definitions. to declare the entity in more than one place, leave
    only one of them with a body.
    """

    [R029.N]
    explain = "Points at the previous declaration or definition that this one conflicts with."

[R030]
brief = "`Self` used outside of a type body"
group = "name-lookup"

    [R030.E]
    explain = """
    # `Self` has no meaning here

    `Self` names the type whose body encloses it. this use has no enclosing type body, so there is
    nothing for it to name. an out-of-line definition qualified with a type name does have one; a
    free function does not.

    ## how to fix

    write the type's name explicitly, or move the declaration into the type body.
    """

[R031]
brief = "out-of-line definition matches no declaration"
group = "redeclaration"

    [R031.E]
    explain = """
    # no matching declaration

    an out-of-line definition attaches to a declaration already present in the scope it names. that
    scope declares nothing this definition matches: either no member of the name exists, or none of
    them has this signature. parameter types, qualifiers, and the generic parameter list all take
    part in the match; the return type alone does not distinguish two declarations.

    ## example

    ```kairo
    class Point { pub fn norm(self) -> f64; }

    fn Point::norm(self, k: f64) -> f64 { }    // no `norm(f64)` is declared in `Point`
    ```

    ## how to fix

    make the signature match the declaration exactly, or add the declaration to the type body.
    """

[R032]
brief = "wrong number of generic arguments"
group = "generics"

    [R032.E]
    explain = """
    # generic argument count mismatch

    the argument list does not fit the declaration's parameter list. either the entity is not
    generic and takes no arguments at all, or too few were supplied to fill the parameters that have
    no default, or more were supplied than the parameter list can absorb. a pack parameter absorbs
    any number of trailing arguments; without one, the maximum is fixed.

    ## example

    ```kairo
    class Pair::<A, B> { }

    var p: Pair::<i32> = ...;    // `Pair` requires 2 arguments
    ```

    ## how to fix

    supply exactly the arguments the parameter list needs, or drop the argument list on a
    non-generic name. `Self` already carries the enclosing type's own arguments and takes none.
    """

    [R032.N]
    explain = "Points at the declaration whose generic parameter list the argument list has to fit."

[R033]
brief = "no generic parameter of that name"
group = "generics"

    [R033.E]
    explain = """
    # unknown named generic argument

    a named generic argument binds to a parameter by name, and the declaration's parameter list has
    no parameter spelled this way.

    ## example

    ```kairo
    class Buf::<T, N> { }

    var b: Buf::<T = i32, Size = 8> = ...;    // the parameter is named `N`
    ```

    ## how to fix

    use the parameter's declared name, or pass the argument positionally.
    """

[R034]
brief = "generic argument specified more than once"
group = "generics"

    [R034.E]
    explain = """
    # duplicate generic argument

    one generic parameter received two arguments. this happens when a named argument names a
    parameter an earlier positional argument already filled, or when the same name is given twice.

    ## how to fix

    supply each parameter once. mixing positional and named arguments is allowed, but the named ones
    must name parameters the positional ones did not reach.
    """

[R035]
brief = "recursive type alias"
group = "alias"

    [R035.E]
    explain = """
    # alias defined in terms of itself

    an alias is a name for a type that must already be expressible, so expanding it has to
    terminate. the aliases on this cycle each expand to the next, so expansion never reaches a real
    type.

    ## example

    ```kairo
    using A = B;
    using B = A;    // expanding either one never terminates
    ```

    ## how to fix

    break the cycle: one alias on it has to name a real type. an indirection does not help here -
    unlike a recursive class, an alias has no storage to hold behind a pointer.
    """

    [R035.N]
    explain = "Points at one alias on the cycle and names the alias it expands to next. One note per step."

[R036]
brief = "type alias nesting limit exceeded"
group = "alias"

    [R036.E]
    explain = """
    # alias chain too deep

    expanding this alias required more nested expansions than the configured limit allows. the chain
    is not necessarily circular - a cycle is reported separately - it is simply longer than the
    resolver is willing to follow.

    ## how to fix

    flatten the chain so fewer aliases stand between the name and the real type, or raise the limit
    with `--cmax-type-alias-depth` (default 64).

    the same code covers the rarer case where the alias is nested so deeply in other resolution work
    that the shared scope stack fills first; that message names `--cmax-scope-depth` instead, because
    lengthening the alias budget would not help.
    """

    [R036.N]
    explain = "Points at the alias whose target continues the chain past the limit."

[R037]
brief = "redeclared with a different return type"
group = "redeclaration"

    [R037.E]
    explain = """
    # return type disagrees

    two declarations of one function have identical parameter types. the return type does not take
    part in overload resolution, so these are not two overloads - they are one function declared
    twice, and the two return types disagree.

    ## example

    ```kairo
    fn f(x: i32) -> i32;
    fn f(x: i32) -> f64;    // same parameters: one function, two return types
    ```

    ## how to fix

    make the return types agree, or change the parameter list so the two really are overloads. an
    omitted return type means `void` and compares equal to an explicit `-> void`.
    """

    [R037.N]
    explain = "Points at the previous declaration and the return type it declared."

[R038]
brief = "redeclared with a different ABI"
group = "redeclaration"

    [R038.E]
    explain = """
    # linkage disagrees

    one entity has one linkage. two declarations of this function ask for different ABIs, which
    would emit two symbols for one function and let the linker pick between them at random.

    ## how to fix

    give every declaration in the chain the same ABI specification, or drop it from all of them.
    """

    [R038.N]
    explain = "Points at the previous declaration, whose ABI this one contradicts."

[R039]
brief = "redeclared with a different qualifier"
group = "redeclaration"

    [R039.E]
    explain = """
    # qualifier disagrees

    the parameter types are identical, so these declarations are one function, and a qualifier that
    changes what the function means differs between them. `inline` and `final` are exempt: neither
    changes the contract, and a later declaration may add them.

    ## how to fix

    apply the qualifier to every declaration in the chain, or to none.
    """

    [R039.N]
    explain = "Points at the previous declaration, whose qualifiers this one contradicts."

[R040]
brief = "default argument redefined"
group = "redeclaration"

    [R040.E]
    explain = """
    # default argument given twice

    a parameter's default argument is written once across the whole redeclaration chain. a later
    declaration may add a default to a parameter that had none, but it may not replace one.

    ## example

    ```kairo
    fn f(x: i32 = 0);
    fn f(x: i32 = 1) { }    // `x` already has a default
    ```

    ## how to fix

    keep the default on one declaration - conventionally the first - and omit it from the others.
    """

    [R040.N]
    explain = "Points at the default argument that was already supplied for this parameter."

[R041]
brief = "class member redeclared"
group = "redeclaration"

    [R041.E]
    explain = """
    # member declared twice

    a member-specification declares each member once. unlike file scope, a class body has no
    forward-declaration rule to make a repeat meaningful: a second declaration of the same member is
    always a mistake.

    ## how to fix

    delete the duplicate. to define the member elsewhere, declare it once in the body and write the
    definition out of line.
    """

    [R041.N]
    explain = "Points at the earlier declaration of this member in the same class body."

[R042]
brief = "specialization without a primary template"
group = "specialization"

    [R042.E]
    explain = """
    # no primary template

    an explicit specialization specializes something. no primary template of this name and kind is
    visible from the specialization's scope, so there is nothing for it to specialize and no
    parameter list to check its arguments against.

    ## example

    ```kairo
    class Box::<i32> { }    // no generic `Box` was declared
    ```

    ## how to fix

    declare the primary template before the specialization, or import it. a specialization must be
    able to see the primary; being in the same program is not enough.
    """

    [R042.N]
    explain = "Points at the specialization that has no primary template to attach to."

[R043]
brief = "explicit specialization after instantiation"
group = "specialization"

    [R043.E]
    explain = """
    # specialization comes too late

    the template was already instantiated with these arguments before this specialization was
    declared. that instantiation used the primary template's body, so the program would contain two
    different meanings for one instantiation depending on where each use appears.

    ## example

    ```kairo
    class Box::<T> { var v: T; }

    fn f(b: Box::<i32>) { }     // instantiates Box<i32> from the primary

    class Box::<i32> { }        // too late: Box<i32> already exists
    ```

    ## how to fix

    move the specialization above every use of that instantiation - a specialization must precede
    the first use of the arguments it specializes.
    """

    [R043.N]
    explain = "Points at the use that first instantiated the template with these arguments."

[R044]
brief = "explicit specialization redeclared in a different file"
group = "specialization"

    [R044.E]
    explain = """
    # specialization declared in two files

    an explicit specialization is one definition for the whole program. declaring it again in
    another translation unit gives the same instantiation two bodies, which is not a redeclaration
    that can be merged.

    ## how to fix

    keep the specialization in one file and import it where it is needed.
    """

    [R044.N]
    explain = "Points at the declaration of this specialization in the other file."

[R045]
brief = "explicit specialization inside a function body"
group = "specialization"

    [R045.W]
    explain = """
    # specialization written in a local scope

    a specialization is global no matter where it is written. this one is inside a function body,
    which reads as if it were local to that function, but it applies to every use of the template in
    the program - including uses in other files that cannot see this declaration.

    ## how to fix

    write the specialization at module scope, where its reach is visible to the reader.
    """

    [R045.N]
    explain = "Explains that the specialization's effect is program-wide, and where it belongs instead."

[R046]
brief = "enum underlying type is not a primitive integer"
group = "enum"

    [R046.E]
    explain = """
    # bad enum underlying type

    an enum's underlying type gives its enumerators their representation, so it has to be a
    primitive integer type. a floating-point type, a pointer, a class, or an alias to any of those
    cannot carry enumerator values.

    ## example

    ```kairo
    enum Color derives f32 { Red, Green }    // not an integer type
    ```

    ## how to fix

    name a primitive integer type - `u8`, `i32`, and so on - or omit the underlying type and let it
    be chosen.
    """

[R047]
brief = "imported name is private to its module"
group = "import"

    [R047.E]
    explain = """
    # name is private in its module

    the name was found in the module it was imported from, but it is declared private there. private
    declarations are part of a module's implementation and do not cross its boundary, so importing
    the module does not make this one visible.

    ## how to fix

    mark the declaration `pub` in its own module, or use a name the module does export.
    """

[R048]
brief = "declaration hides an outer binding"
group = "shadowing"

    [R048.W]
    explain = """
    # shadowed binding

    this declaration introduces a name an enclosing scope already binds to the same type. uses after
    it reach the inner binding, so an assignment meant for the outer one silently writes to a new
    variable instead. only same-type shadowing is reported: shadowing with a different type is
    usually deliberate and reads as such.

    ## example

    ```kairo
    var total = 0;
    if cond {
        var total = compute();    // a new variable; the outer `total` stays 0
    }
    ```

    ## how to fix

    assign to the outer binding (`total = ...`) if that is what you meant, or rename the inner one.
    """

    [R048.N]
    explain = "Points at the outer binding that this declaration hides."

[R049]
brief = "member used without an explicit qualifier"
group = "lookup"

    [R049.E]
    explain = """
    # unqualified member access

    inside a function body a member of the enclosing type is not in unqualified scope. kairo does
    not have c++'s implicit `this->`: an instance member is reached through `self`, and a static
    member through `Self::` (or the type's own name). only nested types, type aliases, and nested
    modules are visible unqualified, because naming a type is not a member access.

    the rule is the same in a `class`, `struct`, `union`, `interface` and `extend` body, and the
    same for an out-of-line `fn Type::method` definition. without it, whether a bare name reached a
    member or a local would depend on where the method happened to be written.

    ## example

    ```kairo
    class Foo {
        var x: i32
        static count: i32 = 0

        fn bar(self) -> i32 {
            return x + count      // neither name is in scope here
        }
    }
    ```

    ## how to fix

    write `self.x` for an instance field or method, and `Self::count` (or `Foo::count`) for a static
    member. if you meant a local, declare it before the use.
    """

    [R049.N]
    explain = "Points at the member declaration the unqualified name would have named."

[R050]
brief = "type alias is more visible than the type it names"
group = "visibility"

    [R050.E]
    explain = """
    # alias widens the visibility of its target

    a type alias introduces a second name for a type, not a second entity. if the alias is more
    visible than the thing it names, that name hands callers a type they were not allowed to reach -
    they can hold values of it, name it in their own signatures, and call its members, all through a
    name the author of the private type never published.

    kairo rejects this at the alias rather than at the use. the alternative is to leave the alias
    legal and diagnose every use of it, which reports the mistake far from the line that made it and
    once per caller instead of once.

    every name the alias mentions counts, not only the outermost one: a pointer, vector, tuple,
    map or generic argument leaks its target just as directly, and so does a private module named as
    a path segment.

    ## example

    ```kairo
    priv struct Base1 {
        var x: i32
    }

    pub type Base2 = Base1      // publishes Base1 under another name
    pub type Base3 = *Base1     // so does this
    ```

    ## how to fix

    make the alias no more visible than its target (`priv type Base2 = Base1`), or make the target as
    visible as the alias (`pub struct Base1`). if the intent was to expose a restricted view of a
    private type rather than the type itself, declare a wrapper with the members you mean to publish
    - an alias cannot narrow what it names.
    """

    [R050.N]
    explain = "Points at the less-visible declaration the alias would have published."

[R051]
brief = "generic parameter has no bound, so it has no members"
group = "member-lookup"

    [R051.E]
    explain = """
    # an unbounded generic parameter has no members

    a generic parameter with no bound is opaque. it stands for *some* type, and nothing about that
    type is known here - not its fields, not its methods, not its operators. so a member access
    through it names nothing, and kairo says so at the template, once, rather than at each
    instantiation.

    this is the one place kairo deliberately parts with c++. a c++ template body is re-checked
    against every argument it is instantiated with, so `t.draw()` is an error at every call that
    passes a type without `draw` and no error at all if the template is never instantiated. kairo
    checks the body against the parameter's DECLARATION instead: whatever the declaration promised
    is exactly what the body may use.

    ## example

    ```kairo
    fn <T> render(x: T) {
        x.draw()                  // error: `T` promised nothing
    }

    interface Drawable { fn draw(const self) }

    fn <T impl Drawable> render(x: T) {
        x.draw()                  // fine: `draw` comes from the bound
    }
    ```

    ## how to fix

    give the parameter a bound. `impl <Interface>` promises a method set structurally;
    `derives <Base>` promises a base class's members and its lineage. either one makes those members
    - and only those - usable in the body.

    if you genuinely want the c++ rule for this parameter, write `: type`
    (`fn <T: type> render(x: T)`). that is the opt-in to duck typing: every access through the
    parameter is accepted here and checked when the template is instantiated.
    """

    [R051.N]
    explain = "Points at the generic parameter's declaration, which is where a bound would go."

[R052]
brief = "overloads distinct in kairo lower to the same c++ signature"
group = "redeclaration"

    [R052.E]
    explain = """
    # two overloads, one c++ signature

    kairo keeps `usize` and `isize` as types of their own, distinct from every fixed-width
    integer, so `f(u64)` and `f(usize)` are two overloads in kairo. but kairo is emitted as c++,
    and there `usize` is `size_t` - on a 64-bit target the same type as `u64`'s `uint64_t`. both
    overloads would lower to one c++ function declared twice, which the c++ compiler rejects in
    generated code nobody wrote. kairo reports it here instead, at the source.

    whether a pair collides depends on the target: `u64`/`usize` and `i64`/`isize` collide where
    pointers are 64 bits, `u32`/`usize` and `i32`/`isize` where they are 32.

    ## example

    ```kairo
    fn f(x: u64) { }
    fn f(x: usize) { }            // same c++ signature as the first on a 64-bit target
    ```

    ## how to fix

    keep one of the overloads and convert at the call site with `as`, or rename one of them. two
    overloads that differ in any other parameter do not collide.
    """

    [R052.N]
    explain = "Points at the earlier overload the flagged one collides with."

[R053]
brief = "'cxx' used alone"
group = "import"

    [R053.E]
    explain = """
    # 'cxx' used alone

    `cxx` is not a module you can name on its own. it is the overlay a translation unit with an
    ffi import gets so that c++'s `std` namespace stays reachable after bare `std` was given to
    kairo's own standard library (`kairo::std`). it has exactly one member, `std`, and naming it
    without that member denotes nothing.

    the alias is transparent: the declarations reached through `cxx::std` keep their own paths
    and are emitted as `::std::...`, exactly as they were before the overlay existed.

    ## example

    ```kairo
    ffi "c++" import "<string>"

    var s: cxx = ...              // 'cxx' names the c++ std overlay; write `cxx::std`
    var t: cxx::std::string       // correct
    ```

    ## how to fix

    write `cxx::std`, then the name you want: `cxx::std::string`, `cxx::std::strlen`. bare `std`
    is kairo's standard library and is a different namespace. a translation unit with no ffi
    import binds no `cxx` at all, and `cxx::std` there is an ordinary undeclared-name error.
    """
