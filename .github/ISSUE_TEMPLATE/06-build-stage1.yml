name: Build issue (Stage 1)
description: Kairo fails to build from source with build.py, or fails to link against a target sysroot.
title: "[build/s1] "
labels: ["build", "stage-1", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Kairo is self-hosted: `python3 build.py` builds it with a prebuilt Kairo release as the seed compiler (see BUILD.md), and it runs LLVM in-process. No host C++ compiler is required. Sysroots are needed for cross-compilation targets.

  - type: dropdown
    id: kind
    attributes:
      label: What failed
      options:
        - Building Kairo from source (build.py)
        - Installing a prebuilt release
        - Compiling a `.k` file
        - Linking against a sysroot
        - Other
    validations:
      required: true

  - type: dropdown
    id: host-platform
    attributes:
      label: Host platform (where the build runs)
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (arm64)
        - macOS (x86_64)
        - Windows (x86_64)
        - Other
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target triple
      description: Target platform if cross-compiling. Leave blank if building for host.
      placeholder: "aarch64-unknown-linux-gnu"

  - type: input
    id: sysroot
    attributes:
      label: Sysroot path
      description: Path passed to build.py / the compiler. Leave blank if not relevant.

  - type: input
    id: seed-version
    attributes:
      label: Compiler version
      description: Output of `kairo --version` (for a source build, the seed compiler's).
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command that failed
      description: Exact command line.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Full output. Use verbose flags where available.
      render: shell
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Sysroot provenance (manually downloaded, distro package, etc.), build.py command line and flags, anything unusual.