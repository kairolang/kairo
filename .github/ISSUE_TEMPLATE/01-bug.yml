name: Bug report
description: A compiler crash, miscompile, incorrect diagnostic, or other reproducible defect.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, confirm the bug reproduces on the latest release or canary build. Search existing issues to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Compiler version
      description: Output of `kairo --version`.
      placeholder: "0.0.1-beta-rc.26052300"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Compiler stage
      options:
        - Stage 0 (C++ bootstrap)
        - Stage 1 (self-hosted)
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (arm64)
        - macOS (x86_64)
        - Windows (x86_64, MSVC)
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A complete `.k` file that triggers the bug. Reduce as far as possible, single file preferred, no external imports if avoidable.
      render: rust
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command line
      description: Exact invocation used to trigger the bug.
      placeholder: "kairo bug.k -O2"
      render: shell
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened. Include the full compiler output, stack trace, or generated code as relevant.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Anything else relevant, bisect results, related issues, suspected cause.