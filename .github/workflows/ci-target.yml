# One target of ci.yml: cross-build the toolchain on a Linux x86_64 runner,
# then run the lit suite sharded on a native runner of that target. The shards
# need only this target's build, so a failed build stops this target's lit
# and no other; a failed shard stops nothing.
#
# The build reads three things from the private kairolang/ci-deps repo:
#   - the 0.3.0 seed compiler (the 0.3 series is in lock step: every 0.3.N
#     compiler is built by the packaged 0.3.0 release),
#   - this target's prebuilt cross LLVM (built from the Lib/llvm-runtimes pin),
#   - this target's own sysroot: inside the target's seed archive, except
#     Darwin's, which holds Apple's SDK and is kept in its own release.

name: ci-target

on:
  workflow_call:
    inputs:
      target: {type: string, required: true}       # artifact and job label, e.g. win-x64
      triple: {type: string, required: true}       # build.py --target
      runner: {type: string, required: true}       # native runner for the shards
      shards: {type: number, required: true}
      seed: {type: string, default: ''}            # seed archive that carries the sysroot
      sysroot: {type: string, default: ''}         # else: the ci-deps sysroot release's root
      exe: {type: string, default: ''}
    secrets:
      CI_DEPS_TOKEN: {required: true}

permissions:
  contents: read

env:
  DEPS_REPO: kairolang/ci-deps
  SEED_TAG: seed-0.3.0
  SEED_SUMS: .github/ci/seed-0.3.0.sha256
  LLVM_TAG: llvm-23.1.6-f71528dff6e1
  LLVM_SUMS: .github/ci/llvm-23.1.6.sha256
  SYSROOTS_TAG: sysroots-llvm23-f71528dff6e1
  SYSROOTS_SUMS: .github/ci/sysroots-llvm23.sha256
  LIT_SYSROOTS_TAG: lit-sysroots-v2-llvm22
  LIT_SYSROOTS_SUMS: .github/ci/lit-sysroots.sha256

jobs:
  # One job per tool: the tools build independently, and on a 4-core runner
  # the six one after another took 30-90 min. The kairo job's output is the
  # staged tree (clang, lld, Lib, sysroot, the test tools); the others add
  # their binary to it.
  build:
    name: build ${{ matrix.tool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tool: [kairo, kals, kld, kfmt, ksys, kcc]
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    env:
      GH_TOKEN: ${{ secrets.CI_DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The build reads the LLVM fork's headers and a few of its sources, the
      # runtime's mimalloc and the vendored zlib / zstd.
      - name: Check out the sources the build reads
        run: python3 Scripts/ci/submodules.py Lib/llvm-runtimes Lib/rt/mimalloc Lib/third_party

      - name: Install zstd and unzip
        run: sudo apt-get install -y --no-install-recommends zstd unzip

      # build.py's object caches carry over from this target and tool's last
      # run, so a change recompiles only what it touches: a rebuild with the
      # caches kept took kairo 47 s instead of 164 s (4 threads, locally).
      # build/objcache holds the Kairo TUs and the registry; .native-objs the
      # one native object, clang's cc1as_main.cpp, which the TU cache does not hold.
      # The objects' own keys decide reuse; the cache key only picks the newest.
      - uses: actions/cache@v4
        with:
          path: |
            build/objcache
            build/.native-objs
          key: objs-v2-${{ inputs.target }}-${{ matrix.tool }}-${{ env.SEED_TAG }}-${{ env.LLVM_TAG }}-${{ env.SYSROOTS_TAG }}-${{ github.sha }}
          restore-keys: objs-v2-${{ inputs.target }}-${{ matrix.tool }}-${{ env.SEED_TAG }}-${{ env.LLVM_TAG }}-${{ env.SYSROOTS_TAG }}-

      - name: Fetch the seed compilers, the cross LLVM and the sysroot
        run: |
          set -euo pipefail
          fetch() { python3 Scripts/ci/fetch_seed.py --repo "$DEPS_REPO" "$@"; }
          host=$(fetch --tag "$SEED_TAG" --archive kairo-0.3.0-x86_64-linux-musl.tar.xz --sums "$SEED_SUMS" --out "$RUNNER_TEMP/seed-host")
          echo "HOST_SEED=$host" >> "$GITHUB_ENV"
          llvm=$(fetch --tag "$LLVM_TAG" --archive "kairo-cross-llvm-${{ inputs.triple }}.tar.zst" --sums "$LLVM_SUMS" --out "$RUNNER_TEMP/llvm" --raw)
          python3 Scripts/ci_deps.py unpack "$llvm" --root "$PWD"

          # The tree's sysroot is the target's own, put in place before the
          # build: build.py leaves an existing one alone and otherwise links
          # the build host's (the wrong target's).
          mkdir -p build/rel
          if [ -n "${{ inputs.seed }}" ]; then
            target=$(fetch --tag "$SEED_TAG" --archive "${{ inputs.seed }}" --sums "$SEED_SUMS" --out "$RUNNER_TEMP/seed-target")
            cp -a "$target/sysroot" build/rel/sysroot
          else
            # The compiler doing the build resolves the target's root in its
            # own sysroot/, so the root goes there as well as into the tree.
            sr=$(fetch --tag "$SYSROOTS_TAG" --archive "sysroot-${{ inputs.sysroot }}-llvm23.tar.zst" --sums "$SYSROOTS_SUMS" --out "$RUNNER_TEMP/sysroot" --raw)
            mkdir -p build/rel/sysroot
            tar --zstd -xf "$sr" -C build/rel/sysroot
            cp -a "build/rel/sysroot/${{ inputs.sysroot }}" "$host/sysroot/"
          fi

      - name: Check the LLVM matches the pinned fork
        run: |
          set -euo pipefail
          want=$(git -C Lib/llvm-runtimes rev-parse HEAD)
          have=$(awk '$1=="llvm"{print $2}' "build/cross-llvm/${{ inputs.triple }}/PREBUILT")
          test "$want" = "$have" || { echo "::error::cross LLVM is $have, Lib/llvm-runtimes is $want: rebuild the ci-deps LLVM release"; exit 1; }

      - name: Build ${{ matrix.tool }} with the seed
        run: |
          set -euo pipefail
          python3 build.py --release --target "${{ inputs.triple }}" ${{ matrix.tool }} \
            --single --no-prebuild --kairo "$HOST_SEED/bin/kairo" --out build/rel --cache-dir build/objcache
          if [ "${{ matrix.tool }}" = kairo ]; then
            # The RUN lines need LLVM's FileCheck, not and count, built for the
            # runner that tests the tree; this target's cross LLVM has them.
            mkdir -p build/rel/test-tools
            for t in FileCheck not count; do
              cp "build/cross-llvm/${{ inputs.triple }}/llvm/bin/$t${{ inputs.exe }}" build/rel/test-tools/
            done
            # obj/ is build scratch the tests never read.
            tar -czf out-kairo.tar.gz --exclude=rel/obj -C build rel
          else
            tar -czf "out-${{ matrix.tool }}.tar.gz" -C build "rel/bin/${{ matrix.tool }}${{ inputs.exe }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.target }}-${{ matrix.tool }}
          path: out-${{ matrix.tool }}.tar.gz
          compression-level: 0
          retention-days: 3

      - id: shards
        run: echo "list=$(python3 -c 'import json;print(json.dumps(list(range(1, ${{ inputs.shards }} + 1))))')" >> "$GITHUB_OUTPUT"

  lit:
    name: lit ${{ matrix.shard }}/${{ inputs.shards }}
    needs: build
    runs-on: ${{ inputs.runner }}
    # lit's own limits (below) end a shard first and still write its results;
    # this one only catches lit itself hanging.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tests compile the runtime from the checkout's Lib/rt, which
      # includes the mimalloc submodule.
      - name: Check out the sources the tests compile
        run: python3 Scripts/ci/submodules.py Lib/rt/mimalloc

      - uses: actions/download-artifact@v4
        with:
          pattern: build-${{ inputs.target }}-*
          merge-multiple: true

      # kairo's output is the tree; each other tool's adds its binary.
      - name: Assemble the tree and install lit
        run: |
          set -euo pipefail
          tar -xzf out-kairo.tar.gz
          for f in out-*.tar.gz; do
            if [ "$f" != out-kairo.tar.gz ]; then tar -xzf "$f"; fi
          done
          ls rel/bin
          python3 -m pip install --quiet lit psutil

      # The tree holds only its own target's roots, but the suite also
      # compiles for Linux, wasi, windows-gnu and Darwin targets everywhere;
      # with no root the compiler builds one through ksys, which on Windows
      # ran past lit's per-test limit.
      - name: Add the cross-target sysroots
        env:
          GH_TOKEN: ${{ secrets.CI_DEPS_TOKEN }}
        run: |
          python3 Scripts/ci/lit_sysroots.py --repo "$DEPS_REPO" --tag "$LIT_SYSROOTS_TAG" \
            --archive lit-sysroots-v2-llvm22.tar.zst --sums "$LIT_SYSROOTS_SUMS" --into rel/sysroot

      # --timeout (needs psutil) turns a hung test into TIMEOUT; --max-time
      # stops the shard before the job limit, so its results are written.
      # A shard cut by --max-time lists only the tests it ran; lit's "Skipped: N"
      # line is the only trace of the rest, so it becomes a TIMEOUT row the gate
      # fails on.
      - name: Run shard
        run: |
          mkdir -p results
          out="results/${{ inputs.target }}-${{ matrix.shard }}.json"
          export KAIRO_BIN="$PWD/rel/bin/kairo${{ inputs.exe }}"
          lit Tests -s -j "$(python3 -c 'import os;print(os.cpu_count())')" \
            --timeout 600 --max-time 3900 --param "filecheck=$PWD/rel/test-tools/FileCheck${{ inputs.exe }}" \
            --num-shards=${{ inputs.shards }} --run-shard=${{ matrix.shard }} \
            -o "$out" 2>&1 | tee lit.log || true
          skipped=$(sed -n 's/^ *Skipped *: *\([0-9][0-9]*\).*/\1/p' lit.log | head -1)
          if [ -n "$skipped" ]; then
            python3 - "$out" "$skipped" <<'PY'
          import json, os, sys
          path, n = sys.argv[1], sys.argv[2]
          d = json.load(open(path)) if os.path.exists(path) else {"tests": []}
          d["tests"].append({"name": f"shard cut by --max-time: {n} tests did not run", "code": "TIMEOUT"})
          json.dump(d, open(path, "w"))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.target }}-${{ matrix.shard }}
          path: results/*.json
          retention-days: 7

      - name: Judge shard
        run: python3 Scripts/ci/gate.py results --expect 1 --summary "$GITHUB_STEP_SUMMARY"
