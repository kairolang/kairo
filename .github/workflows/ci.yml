# Builds the toolchain for five targets and runs the lit suite on each
# (ci-target.yml does one target). Each target is gated only by its own
# build; the gate job is the one required check.
#
# FAIL, UNRESOLVED and TIMEOUT fail the run. An XPASS is a warning: drop the
# test's XFAIL line.
#
# Runs on every push except to main (main only ever fast-forwards to release
# commits that already ran) and on pull requests. A pull request from a branch
# of this repository is covered by that branch's push run, whose checks GitHub
# shows on the pull request. A pull request from a fork cannot run: the build
# reads the private ci-deps repo and a fork's pull request gets no secrets.

name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether this event runs the suite: a push does; a pull request from a
  # branch of this repository is covered by that branch's push run; a fork's
  # cannot run.
  trigger:
    name: 'trigger: push, same-repo PR or fork'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.m.outputs.run }}
      reason: ${{ steps.m.outputs.reason }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=same-repo" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
          fi

  # Shard counts: keep `expect` in the gate equal to their sum.
  linux-x64:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    uses: ./.github/workflows/ci-target.yml
    with: {target: linux-x64, triple: x86_64-linux-musl, runner: ubuntu-24.04, shards: 13, seed: kairo-0.3.0-x86_64-linux-musl.tar.xz}
    secrets: {CI_DEPS_TOKEN: '${{ secrets.CI_DEPS_TOKEN }}'}

  linux-arm64:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    uses: ./.github/workflows/ci-target.yml
    with: {target: linux-arm64, triple: aarch64-linux-musl, runner: ubuntu-24.04-arm, shards: 13, seed: kairo-0.3.0-aarch64-linux-musl.tar.xz}
    secrets: {CI_DEPS_TOKEN: '${{ secrets.CI_DEPS_TOKEN }}'}

  win-x64:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    uses: ./.github/workflows/ci-target.yml
    with: {target: win-x64, triple: x86_64-windows-gnu, runner: windows-2025, shards: 13, seed: kairo-0.3.0-x86_64-windows-gnu.zip, exe: '.exe'}
    secrets: {CI_DEPS_TOKEN: '${{ secrets.CI_DEPS_TOKEN }}'}

  win-arm64:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    uses: ./.github/workflows/ci-target.yml
    with: {target: win-arm64, triple: aarch64-windows-gnu, runner: windows-11-arm, shards: 13, seed: kairo-0.3.0-aarch64-windows-gnu.zip, exe: '.exe'}
    secrets: {CI_DEPS_TOKEN: '${{ secrets.CI_DEPS_TOKEN }}'}

  mac-arm64:
    needs: trigger
    if: needs.trigger.outputs.run == 'true'
    uses: ./.github/workflows/ci-target.yml
    with: {target: mac-arm64, triple: arm64-apple-macosx11.0, runner: macos-15, shards: 5, sysroot: arm64-apple-macosx}
    secrets: {CI_DEPS_TOKEN: '${{ secrets.CI_DEPS_TOKEN }}'}

  # Compiler/Spec/SelfHosting.md, "Fixed point": the seed-built compiler (A,
  # linux-x64's tree) builds B, B builds C, and B and C must be bit-identical.
  # Only linux-x64 runs where it is built, so only it is checked.
  selfhost:
    name: self-rebuild
    needs: [trigger, linux-x64]
    if: needs.trigger.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.CI_DEPS_TOKEN }}
      TRIPLE: x86_64-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Check out the sources the build reads
        run: git submodule update --init --depth 1 -- Lib/llvm-runtimes Lib/rt/mimalloc Lib/third_party

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zstd
        run: sudo apt-get install -y --no-install-recommends zstd

      - uses: actions/download-artifact@v4
        with:
          name: tree-linux-x64

      - name: Fetch the cross LLVM
        run: |
          set -euo pipefail
          llvm=$(python3 Scripts/ci/fetch_seed.py --repo kairolang/ci-deps --tag llvm-23.1.6-f71528dff6e1 \
                   --archive "kairo-cross-llvm-$TRIPLE.tar.zst" --sums .github/ci/llvm-23.1.6.sha256 \
                   --out "$RUNNER_TEMP/llvm" --raw)
          python3 Scripts/ci_deps.py unpack "$llvm" --root "$PWD"
          tar -xzf compiler-tree.tar.gz

      - name: Build B with A, then C with B
        run: |
          set -euo pipefail
          prev=rel
          for s in B C; do
            python3 build.py --release --reproducible --target "$TRIPLE" kairo \
              --single --no-prebuild --kairo "$prev/bin/kairo" --out "build/$s"
            prev="build/$s"
          done

      - name: B and C are bit-identical
        run: |
          sha256sum build/B/bin/kairo build/C/bin/kairo
          cmp build/B/bin/kairo build/C/bin/kairo || {
            echo "::error title=self-rebuild::the compiler is not a fixed point: B and C differ (Compiler/Spec/SelfHosting.md)"
            exit 1
          }

  gate:
    name: gate
    needs: [trigger, linux-x64, linux-arm64, win-x64, win-arm64, mac-arm64, selfhost]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Pull request covered by the push run
        if: needs.trigger.outputs.reason == 'same-repo'
        run: echo "::notice::this branch's push run tests the same commit; its checks are on this pull request"

      - name: Fork pull requests cannot run
        if: needs.trigger.outputs.reason == 'fork'
        run: |
          echo "::error::the build reads the private ci-deps repo, and a fork's pull request gets no secrets: a maintainer pushes the branch to kairolang/kairo to run CI"
          exit 1

      - uses: actions/checkout@v4
        if: needs.trigger.outputs.run == 'true'

      - uses: actions/download-artifact@v4
        if: needs.trigger.outputs.run == 'true'
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      # A target whose build failed has no results: the expected count makes
      # that fail the gate instead of vanishing. A failed job with no results
      # of its own (self-rebuild) fails it through the job check.
      - name: Judge all shards
        if: needs.trigger.outputs.run == 'true'
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jobs_ok=0
          python3 -c "
          import json, os, sys
          bad = [n for n, j in json.loads(os.environ['JOBS']).items() if n != 'trigger' and j['result'] != 'success']
          for n in bad:
              print(f'::error title={n}::{n} did not succeed')
          sys.exit(1 if bad else 0)
          " || jobs_ok=1
          python3 Scripts/ci/gate.py results --expect 57 --summary "$GITHUB_STEP_SUMMARY" || exit 1
          exit $jobs_ok
