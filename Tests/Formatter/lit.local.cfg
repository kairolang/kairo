# kfmt golden tests (Extras/Formatter/README, section 16).
#
# Each test formats itself with `kfmt --stdout` and diffs the result against
# Expected/<name>.k, then runs `kfmt --check` on that expected file, which must
# change nothing (idempotency, 16.2). kfmt prints nothing and exits 1 when its
# own safety checks refuse the output (it must parse, keep the code, comments
# and imports, give the same tree, and format to itself), so a passing diff is
# also a passing tree-equality check (16.3) on that input.
#
# Expected/ holds outputs, not tests; Inputs/ (excluded suite-wide) holds
# fixtures a test reads.
import os
import shlex

config.excludes = set(config.excludes) | {"Expected"}

# kfmt: $KFMT_BIN (the release smoke's), else the one beside the kairo lit
# resolved, else the newest build/<triple>/{debug,release}/bin/kfmt (the
# release tree may predate kfmt while its kairo is the newest).
def _find_kfmt():
    env = os.environ.get("KFMT_BIN")
    if env:
        return env
    beside = os.path.join(os.path.dirname(config.kairo_bin), "kfmt")
    if os.path.exists(beside):
        return beside
    build = os.path.join(os.path.dirname(config.test_source_root), "build")
    found = []
    if os.path.isdir(build):
        for t in os.listdir(build):
            for prof in ("debug", "release"):
                c = os.path.join(build, t, prof, "bin", "kfmt")
                if os.path.exists(c):
                    found.append((os.path.getmtime(c), c))
    return max(found)[1] if found else beside

_kfmt = _find_kfmt()
if not os.path.exists(_kfmt):
    config.unsupported = True
    lit_config.note("kfmt: not found at %s (build it: python3 build.py --debug kfmt)" % _kfmt)
else:
    lit_config.note("kfmt: %s" % _kfmt)
config.substitutions.append(("%kfmt", shlex.quote(_kfmt)))
