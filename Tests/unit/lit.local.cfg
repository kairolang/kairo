# The in-module Test() functions, run through kunit (Compiler/Tooling/UnitTests.k,
# `python3 build.py --debug kunit`). kunit is a verification driver, not a
# staged tool: $KUNIT_BIN, else the one beside the kairo lit resolved. Without
# it every test here is UNSUPPORTED.
import os
import shlex

_kunit = os.environ.get("KUNIT_BIN") or os.path.join(os.path.dirname(config.kairo_bin), "kunit")
if not os.path.isfile(_kunit):
    config.unsupported = True
    lit_config.note("kunit: not found at %s (build it: python3 build.py --debug kunit)" % _kunit)
else:
    lit_config.note("kunit: %s" % _kunit)
config.substitutions.append(("%kunit", shlex.quote(_kunit)))
