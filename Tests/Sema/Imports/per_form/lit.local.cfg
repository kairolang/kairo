# Import CORPUS, not tests. These files exist to be imported BY the tests in
# this directory (`import foo::*`, `import bar::{...}`), so lit must not pick
# them up and compile them on their own -- standalone they assert nothing and
# would only report the diagnostics of a file taken out of context.
#
# Anything added here must be a file that another test imports. A file that is
# meant to be a test gets a RUN line instead.
config.excludes = [
    "bar.k",
    "baz.k",
    "ext_a.k",
    "ext_b.k",
    "foo.k",
    "foo_reexport.k",
]
