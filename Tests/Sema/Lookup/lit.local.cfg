# nameres_lib.k is the import corpus for name_resolution.k, not a test of its
# own. It must stay out of collection: compiled standalone it asserts nothing.
#
# (A comment here must not contain the literal text "RUN:": lit matches it
# as a real RUN line and tries to execute it.)
#
# ADD to the inherited excludes rather than replacing them: a plain assignment
# silently drops the suite-wide "Inputs" / "Manual" / ... exclusions for every
# directory below this one.
config.excludes = set(config.excludes) | {"nameres_lib.k"}
