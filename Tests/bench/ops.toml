# The rows of the builtin-library benchmarks: one [[row]] per operation, in
# the order the report prints them. run.py reads this file; every program
# under cpp/, rust/ and kairo/ implements the rows of its group under the same
# ids and sizes. README says how to add one.
#
#   id      the name a program is asked for; its group is the part before
#           the dot unless `group` names another
#   label   the operation, as the report's table names it
#   sizes   one cell per size; `size` says what the number counts
#   op      what one operation is: every time is nanoseconds per `op`
#   timed   what is inside the timed region (setup and teardown outside it
#           are not measured)
#   cpp / rust / kairo   the call each language makes; kairo names the call
#           of the library under test
#   kairo_checksum = false   the Kairo program's checksum is not compared
#           with the others' (a row whose result is the library's own hash)
#
# Rows ending in `_fast` repeat the row before them with the fast hasher of
# cpp/bench.h and rust/bench.rs (the same function in both) in place of the
# standard library's default: std::hash, which is the identity for an integer
# in libc++, and SipHash-1-3 with per-process keys in Rust. Kairo has one
# hasher, so its number is the same measurement in both rows.

[kairo]
# What the Kairo column measures; the report prints it in the column's legend.
library = "old library (Lib/builtin as installed)"

[[group]]
id = "string"
title = "String"
against = "std::string, String"

[[group]]
id = "slice"
title = "Slice and sort"
against = "<algorithm> on std::vector storage, slice methods"

[[group]]
id = "vector"
title = "Vector"
against = "std::vector, Vec"

[[group]]
id = "map"
title = "Hash map and set"
against = "std::unordered_map / std::unordered_set, HashMap / HashSet"

[[group]]
id = "hash"
title = "Hasher"
against = "std::hash, RandomState (SipHash-1-3), and the fast hasher"

[[group]]
id = "num"
title = "Number text"
against = "std::to_chars / std::from_chars, `{}` formatting / str::parse"

[[group]]
id = "iter"
title = "Iterator chains"
against = "C++20 <ranges>, std iterator adapters, and the hand-written loop"

# --- string ------------------------------------------------------------------

[[row]]
id = "string.create_destroy"
label = "create + destroy"
sizes = [0, 8, 32, 256]
size = "bytes copied into the string"
op = "one string built from a byte range and destroyed"
timed = "construction from (pointer, length) and destruction; the length is opaque to the optimizer"
cpp = "std::string(p, n)"
rust = "String::from(&str)"
kairo = "string(p, n)"

[[row]]
id = "string.push_byte"
label = "append one byte, to 1 MiB"
sizes = [1048576]
size = "final length in bytes"
op = "one byte appended"
timed = "the appends, starting from an empty string with no reserve; not the destruction"
cpp = "push_back(char)"
rust = "String::push(char), ASCII"
kairo = "push(u8)"

[[row]]
id = "string.append_literal"
label = "append a short literal"
sizes = [4, 12]
size = "bytes in the literal"
op = "one literal appended"
timed = "100000 appends to an empty string with no reserve"
cpp = "operator+=(const char*)"
rust = "push_str(&str)"
kairo = "push_str / +="

[[row]]
id = "string.find"
label = "find an 8-byte needle"
sizes = [64, 4096, 1048576]
size = "haystack bytes"
op = "one search"
timed = "the search; the needle matches only at the very end, the haystack is letters a..p and shares the needle's first seven bytes' alphabet"
cpp = "std::string::find(const std::string&)"
rust = "str::find(&str)"
kairo = "find(string)"

[[row]]
id = "string.eq"
label = "equality of short keys"
sizes = [8, 16]
size = "bytes in each key"
op = "one comparison"
timed = "1024 pairs of equal-length strings, half equal and half differing in the last byte"
cpp = "operator=="
rust = "=="
kairo = "=="

[[row]]
id = "string.codepoints"
label = "count code points, cold"
sizes = [4096, 1048576]
size = "bytes of UTF-8 (70% one-byte, 20% two-byte, 10% three-byte code points)"
op = "one byte scanned"
timed = "a full count over the text"
cpp = "a loop counting non-continuation bytes (std::string has no count)"
rust = "chars().count()"
kairo = "codepoints() on a string whose count is not yet stored"

[[row]]
id = "string.codepoints_cached"
label = "count code points, cached"
sizes = [4096, 1048576]
size = "bytes of UTF-8"
op = "one call"
timed = "2^20 calls on a string whose count is already stored"
cpp = "none: the count is not stored"
rust = "none: the count is not stored"
kairo = "codepoints() after the first call"

