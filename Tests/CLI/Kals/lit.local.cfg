# The language server, driven by a scripted LSP client (Analyzer/Dev/lsp_client.py).
# kals: $KALS_BIN, else the one beside the kairo lit resolved. Without it
# every test here is UNSUPPORTED.
import os
import shlex

_kals = os.environ.get("KALS_BIN") or os.path.join(os.path.dirname(config.kairo_bin), "kals")
if not os.path.isfile(_kals):
    config.unsupported = True
    lit_config.note("kals: not found at %s" % _kals)
config.substitutions.append(("%kals", shlex.quote(_kals)))
config.substitutions.append(("%lsp_dev", shlex.quote(os.path.join(os.path.dirname(config.test_source_root), "Analyzer", "Dev"))))
