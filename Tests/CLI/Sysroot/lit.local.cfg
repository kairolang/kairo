# ksys build tests (build_*.k): they need the real share tree, the bundled roots the
# builtins / runtimes stages still take their archives from (TODO(SYSROOT-RT) in
# Linker/Sysroot/Generator.k), and cmake + ninja (plan() requires them for any recipe
# with runtimes). Without all three the tests are UNSUPPORTED, not failed.
# KSYS_TEST_SHARE / KSYS_RT_FALLBACK override the in-tree defaults. The names avoid a
# %ksys prefix: lit would expand the parent's %ksys inside them first.
import os
import shutil
import sys

_repo = os.path.dirname(config.test_source_root)
_share = os.environ.get("KSYS_TEST_SHARE") or os.path.join(_repo, "build", "sysroot-share")
_rt = os.environ.get("KSYS_RT_FALLBACK") or os.path.join(
    _repo, "build", "x86_64-linux-gnu", "release", "sysroot")
if (os.path.isfile(os.path.join(_share, "registry.toml"))
        and os.path.isdir(os.path.join(_rt, "x86_64-linux-musl"))
        and os.path.isdir(os.path.join(_rt, "x86_64-linux-gnu-glibc2.31"))
        and shutil.which("cmake") and shutil.which("ninja")):
    config.available_features.add("ksys-share")
    config.substitutions.append(("%sysgen_share", _share))
    config.substitutions.append(("%sysgen_rt", _rt))
config.substitutions.append(
    ("%sysgen_env", '"%s" "%s"' % (sys.executable,
                                 os.path.join(config.test_source_root, "CLI", "Sysroot", "Inputs",
                                              "ksys_env.py"))))
