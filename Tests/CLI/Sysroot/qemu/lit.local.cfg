# User-mode QEMU for the cross-run tests here: a host without it reports them
# UNSUPPORTED, never FAIL. Forward slashes, as in Codegen/FloatMethods.
import shutil

for _q in ("qemu-ppc64le", "qemu-mips", "qemu-s390x", "qemu-loongarch64"):
    _p = shutil.which(_q)
    if _p:
        config.available_features.add(_q)
        config.substitutions.append(("%" + _q.replace("-", "_"), _p.replace("\\", "/")))
