# kunit (Compiler/Tooling/UnitTests.k) calls the explain renderer on texts the
# shipped table does not hold. $KUNIT_BIN, else the one beside the kairo lit
# resolved; a test that runs it says `REQUIRES: kunit`.
import os
import shlex

_kunit = os.environ.get("KUNIT_BIN") or os.path.join(os.path.dirname(config.kairo_bin), "kunit")
if os.path.isfile(_kunit):
    config.available_features.add("kunit")
config.substitutions.append(("%kunit", shlex.quote(_kunit)))
