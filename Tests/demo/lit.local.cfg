# Bare-metal demos: kairo with no host sysroot/resource roots. The binary is
# the one lit.cfg.py resolved (absolute), not $KAIRO_BIN raw: a relative
# KAIRO_BIN breaks once lit runs the test from this directory. Forward
# slashes: bash eats the backslashes of a Windows path. --freestanding: the
# driver now finds builtin/std/sysroot beside the binary when no flag names
# them, and a bare-metal build wants none of them (the hosted runtime in
# lib/rt needs stdlib.h); freestanding is what keeps it rootless.
config.substitutions.insert(0, ("%kairo_bare", config.kairo_bin.replace("\\", "/") + " --error-format=basic --freestanding"))
