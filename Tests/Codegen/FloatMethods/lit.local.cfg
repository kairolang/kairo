# User-mode QEMU for cross.k (the float methods on i686 and aarch64). A host
# without one reports that test UNSUPPORTED, never FAIL. Forward slashes, as
# in OperatorSemantics/lit.local.cfg.
import shutil

for _q in ("qemu-i386", "qemu-aarch64"):
    _p = shutil.which(_q)
    if _p:
        config.available_features.add(_q)
        config.substitutions.append(("%" + _q.replace("-", "_"), _p.replace("\\", "/")))
