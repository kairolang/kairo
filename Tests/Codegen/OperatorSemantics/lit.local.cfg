# User-mode QEMU for the cross-target runs (shift_run.k). A host without one
# reports those tests UNSUPPORTED, never FAIL. Forward slashes, as elsewhere.
import shutil

for _q in ("qemu-arm", "qemu-aarch64", "qemu-riscv64"):
    _p = shutil.which(_q)
    if _p:
        config.available_features.add(_q)
        config.substitutions.append(("%" + _q.replace("-", "_"), _p.replace("\\", "/")))
