# The programs in this directory are not lit tests. They are complete Kairo
# programs that assert their own results and report via exit code, so that they
# stay runnable the day stage 1 can emit a binary, with no harness to port. They
# carry no RUN lines, and lit would otherwise report every one of them as
# UNRESOLVED.
#
# Run them with ./run.sh <path-to-kairo>, or individually; see README.
config.suffixes = []
