# The linker runner sends some links out of process, to the kld beside the
# kairo under test (Compiler/Spec/Linking.md). Tests that need one say
# `REQUIRES: kld`, so a tree built without kld reports them UNSUPPORTED.
import os

_bin = os.path.dirname(config.kairo_bin)
if any(os.path.isfile(os.path.join(_bin, n)) for n in ("kld", "kld.exe")):
    config.available_features.add("kld")
