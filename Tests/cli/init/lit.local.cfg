# `kairo --init`: the project it creates, built and run. The `make` feature
# gates the test that drives the generated Makefile; `dir-permissions` gates
# the one that needs a directory it cannot write to, which a POSIX system
# enforces for every user except root.
import os
import shutil

if shutil.which("make"):
    config.available_features.add("make")

if os.name == "posix" and hasattr(os, "geteuid") and os.geteuid() != 0:
    config.available_features.add("dir-permissions")
